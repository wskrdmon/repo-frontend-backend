version: '3.8'

services:

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: daniethuser
      POSTGRES_PASSWORD: daniethpass
      POSTGRES_DB: daniethdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api_gateway:
    build:
      context: .
      dockerfile: api_gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://daniethuser:daniethpass@postgres:5432/daniethdb
    depends_on:
      - postgres

  auth_service:
    build:
      context: .
      dockerfile: auth_service/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://daniethuser:daniethpass@postgres:5432/daniethdb
    depends_on:
      - postgres

  analysis_service:
    build:
      context: .
      dockerfile: analysis_service/Dockerfile
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql+asyncpg://daniethuser:daniethpass@postgres:5432/daniethdb
    depends_on:
      - postgres

  tool_registry:
    build:
      context: .
      dockerfile: tool_registry/Dockerfile
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=postgresql+asyncpg://daniethuser:daniethpass@postgres:5432/daniethdb
    depends_on:
      - postgres

  scanner_service:
    build:
      context: .
      dockerfile: scanner_service/Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://daniethuser:daniethpass@postgres:5432/daniethdb
      - REDIS_URL=redis://redis:6379
      - TOOL_REGISTRY_URL=http://tool_registry:8003
    depends_on:
      - postgres
      - redis
      - tool_registry

volumes:
  postgres_data:
